name: Source build
on: pull_request

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Swift 6.4.3
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/swift-6.4.3.pkg"
          curl --fail --location --retry 3 --output "$pkg" https://download.swift.org/swift-6.4.3-release/xcode/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-osx.pkg
          signature=$(pkgutil --check-signature "$pkg")
          grep -Fq 'Developer ID Installer: Swift Open Source (V9AUD2URP3)' <<< "$signature"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          rm "$pkg"
      - name: Verify clean checkout
        run: ./scripts/verify.sh
